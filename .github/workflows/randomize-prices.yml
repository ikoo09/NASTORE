name: Randomize product prices

on:
  push:
    paths:
      - '.github/workflows/randomize-prices.yml'

permissions:
  contents: write

jobs:
  randomize-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set random prices
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          prices = [471000,348000,422000,571000,572000,528000,579000,509000,341000,489000,416000,492000,426000,385000,349000,445000]
          i = 0
          def repl(m):
              nonlocal_i[0] += 1
              return m.group(1) + str(prices[nonlocal_i[0]-1])
          nonlocal_i = [0]
          new_text, count = re.subn(r'(\\bprice\\s*:\s*)\\d+', repl, text)
          if count != len(prices):
              raise SystemExit(f'Expected {len(prices)} products, found {count}')
          p.write_text(new_text, encoding='utf-8')
          print(f'Updated {count} prices')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Randomize all product prices" || exit 0
          git push
